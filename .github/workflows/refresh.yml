name: Refresh schedule.json

# Rebuilds schedule.json from the Wuthering Waves Wiki once a day. The script leaves
# the file untouched when nothing but its timestamp would change, so a quiet day
# produces no commit and no churn in the raw CDN.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rebuild from the wiki
        run: python wiki_to_schedule.py --out schedule.json

      - name: Commit if the data moved
        run: |
          if git diff --quiet -- schedule.json; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git commit -m "Refresh schedule.json from the wiki"
          git push
